<!DOCTYPE html>
<html>
  <head>
    <title>Web Tracker</title>
    <style>
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        padding: 12px;
        width: 280px;
        background: #1b1b1b;
        color: #f2f2f2;
      }

      h3 {
        margin-top: 0;
        margin-bottom: 12px;
        font-size: 18px;
        font-weight: 600;
        text-align: center;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      tr {
        transition: 0.2s ease;
      }

      tr:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      td {
        padding: 6px 4px;
        font-size: 13px;
      }

      .site-cell {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .favicon {
        width: 16px;
        height: 16px;
        border-radius: 3px;
      }

      .empty {
        text-align: center;
        margin-top: 14px;
        color: #aaa;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <h3>Website Usage</h3>
    <table id="usageTable"></table>
    <div id="emptyHint" class="empty" style="display:none;">
      No data yet. Start browsing...
    </div>

    <script>
      function formatTime(seconds) {
        if (seconds < 60) return seconds + "s";
        if (seconds < 3600)
          return Math.floor(seconds / 60) + "m " + (seconds % 60) + "s";
        return (
          Math.floor(seconds / 3600) +
          "h " +
          Math.floor((seconds % 3600) / 60) +
          "m"
        );
      }

      function getFavicon(domain) {
        return "https://www.google.com/s2/favicons?domain=" + domain;
      }

      async function loadData() {
        const data = await chrome.storage.local.get("usage");
        const usage = data.usage || {};
        const table = document.getElementById("usageTable");
        const emptyHint = document.getElementById("emptyHint");

        table.innerHTML = "";

        let rows = Object.entries(usage);

        if (rows.length === 0) {
          emptyHint.style.display = "block";
          return;
        }

        emptyHint.style.display = "none";

        // Sort: website dengan waktu terlama muncul di atas
        rows.sort((a, b) => b[1] - a[1]);

        for (const [domain, seconds] of rows) {
          const tr = document.createElement("tr");

          const tdSite = document.createElement("td");
          tdSite.className = "site-cell";

          const fav = document.createElement("img");
          fav.src = getFavicon(domain);
          fav.className = "favicon";

          const nameText = document.createElement("span");
          nameText.textContent = domain;

          tdSite.appendChild(fav);
          tdSite.appendChild(nameText);

          const tdTime = document.createElement("td");
          tdTime.textContent = formatTime(seconds);

          tr.appendChild(tdSite);
          tr.appendChild(tdTime);
          table.appendChild(tr);
        }
      }

      loadData();
    </script>
  </body>
</html>
